<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bible Brunch</title>
<meta name="description" content="Monthly Bible Brunch gatherings: the plan, food sign-ups, the day-of workbook, and challenges.">
<meta name="theme-color" content="#FFE14D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bible Brunch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@500;700;800;900&display=swap">
<style>
/* Layout: phone-sized app on a confetti table; sticker-style cards with ink outlines and hard shadows. One bright look, no dark variant by choice. */
:root{
  color-scheme:light;
  --paper:#FFFFFF; --ink:#161616; --soft:#5B5B66; --line:#161616;
  --pink:#FF4FA3; --yellow:#FFE14D; --aqua:#7DF3F0; --green:#3CCB6C; --purple:#8E6BFF; --orange:#FF9F1C;
  --wash:#FFF6FB;
  --display:"Chewy","Cooper Black","Comic Sans MS",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --pop:3px 3px 0 var(--ink);
}
html,body{height:100%}
body{background:#FFF1A8;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(circle at 12px 12px,#FF4FA3 2.5px,transparent 3px),radial-gradient(circle at 36px 30px,#7DF3F0 3px,transparent 3.5px),radial-gradient(circle at 26px 48px,#8E6BFF 2px,transparent 2.5px);
  background-size:56px 56px;display:flex;align-items:center;justify-content:center;padding-inline:16px}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}

.phone{position:relative;width:100%;max-width:400px;height:min(860px,calc(100% - 32px));background:var(--paper);
  border-radius:40px;overflow:hidden;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);display:flex;flex-direction:column}
@media (max-width:520px){body{padding-inline:0;background-image:none;background:var(--paper)} .phone{max-width:none;height:100%;border-radius:0;border:0;box-shadow:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.pad{padding:8px 18px 28px;display:flex;flex-direction:column;gap:16px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 18px 10px}
.brand{font-family:var(--display);font-size:32px;line-height:1;letter-spacing:.5px}
.brand .dot{color:var(--pink)}
.sub{font-weight:800;font-size:13px;color:var(--soft)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink);flex:none}
.iconbtn svg{width:20px;height:20px}
h1,h2,h3{margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-size:24px;line-height:1.1}
.label{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}

/* ---- the square theme card ---- */
.tile{position:relative;aspect-ratio:1/1;width:100%;max-width:100%;border-radius:22px;background:var(--cbg);border:3px solid var(--ink);box-shadow:var(--pop);overflow:hidden;container-type:inline-size;display:block;padding:0;text-align:center}
button.tile{transition:transform .12s ease}
button.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.stk{position:absolute;z-index:1;pointer-events:none;filter:drop-shadow(1.5px 1.5px 0 rgba(0,0,0,.18))}
.stk svg{width:100%;height:auto;display:block;overflow:visible}
.ttl{position:absolute;z-index:2;left:8%;right:8%;top:50%;transform:translateY(-54%) rotate(-3deg);font-family:var(--display);text-transform:uppercase;line-height:.92;display:flex;flex-direction:column;align-items:center}
.ttl span{display:block;white-space:nowrap;text-shadow:0 0 6px var(--cbg),0 0 10px var(--cbg)}
.ttl i{font-style:normal;font-size:.78em;margin-right:.08em}
.ttl .swoosh{width:62%;height:auto;margin-top:2cqw}
.ttl .burst{position:absolute;right:-4%;top:-16%;width:14%}
.tdate{position:absolute;z-index:3;left:50%;bottom:5%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;font-size:max(10px,6.4cqw);letter-spacing:.06em;padding:.25em .7em;border-radius:999px;white-space:nowrap}
.tbadge{position:absolute;z-index:3;left:50%;top:5%;transform:translateX(-50%) rotate(-2deg);background:var(--paper);border:2.5px solid var(--ink);font-weight:900;font-size:max(10px,6cqw);padding:.15em .7em;border-radius:999px;white-space:nowrap}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cards .first{grid-column:1 / -1}
.tw{display:flex;flex-direction:column;gap:7px;min-width:0}
.seg.mini{border-radius:12px;border-width:2px}
.seg.mini button{padding:7px 2px;font-size:12.5px;border-left-width:2px}
.seg.mini button[aria-pressed="true"][data-rsvp="going"]{background:var(--green)}
.seg.mini button[aria-pressed="true"][data-rsvp="no"]{background:#FFD0E4}
.hint{font-weight:700;color:var(--soft);font-size:14px;margin:0}

/* boxes */
.box{background:var(--paper);border:2.5px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--pop)}
.box p{margin:0}
.box.tint{background:var(--wash)}
.btn{border:2.5px solid var(--ink);border-radius:14px;padding:11px 16px;font-weight:900;background:var(--pink);color:var(--ink);box-shadow:2px 2px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.y{background:var(--yellow)} .btn.w{background:var(--paper)} .btn.g{background:var(--green)}
.btn.block{width:100%}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.verse{font-family:var(--display);font-size:21px;line-height:1.25}
.ref{font-weight:900;color:var(--pink)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2.5px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--paper)}
.seg button{border:0;border-left:2.5px solid var(--ink);background:none;padding:10px 4px;font-weight:900;font-size:14px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--yellow)}

/* itinerary */
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}
.meta dt{font-weight:800;color:var(--soft)} .meta dd{margin:0;font-weight:800}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:70px 18px 1fr;gap:8px;align-items:start;min-height:40px}
.timeline .clock{font-weight:900;font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.timeline .pin{position:relative;height:100%}
.timeline .pin::before{content:"";position:absolute;left:4px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--aqua));border:2.5px solid var(--ink)}
.timeline .pin::after{content:"";position:absolute;left:8.5px;top:18px;bottom:-4px;width:2.5px;background:var(--ink)}
.timeline li:last-child .pin::after{display:none}
.timeline .what{font-weight:700;padding-bottom:12px}
.timeline .what small{display:block;font-weight:700;color:var(--soft)}
.always{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:1px}
.note{background:var(--wash);border:2px dashed var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:2px dashed #DADAE3}
.list li:first-child{border-top:0}
.allb{background:#FFF6C9}
.allitem{font-family:var(--disp,inherit);font-weight:900;font-size:22px;margin:-4px 0 0}
.allme{display:flex;align-items:center;gap:12px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px}
.allme b{display:block;font-size:17px}
.col{display:flex;flex-direction:column;gap:10px}
.list .grow{flex:1;min-width:0;font-weight:800}
.list .who{font-size:13px;font-weight:700;color:var(--soft)}
.pill{border:2.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:900;white-space:nowrap}
.pill.on{background:var(--green)} .pill.taken{opacity:.45;cursor:default}
.check{display:flex;gap:12px;align-items:flex-start;padding:7px 0;font-weight:700}
.check input{appearance:none;flex:none;width:24px;height:24px;border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);display:grid;place-items:center;margin:0}
.check input:checked{background:var(--green)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:checked + span{text-decoration:line-through;color:var(--soft)}
.faces{display:flex;align-items:center;gap:10px;font-weight:800;font-size:14px}
.faces .stack{display:flex}
.face{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;border:2.5px solid var(--ink);margin-left:-9px;background:var(--aqua)}
.face:nth-child(2){background:var(--yellow)} .face:nth-child(3){background:var(--pink)} .face:nth-child(4){background:var(--green)} .face:nth-child(5){background:var(--orange)}
.face:first-child{margin-left:0}
.face.you{background:var(--purple);color:#fff}
.sample{font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--ink);border-radius:6px;padding:0 5px;background:var(--paper);color:var(--ink);white-space:nowrap}
input[type=text],textarea{width:100%;border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;padding:10px 12px;font-weight:600}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}

/* workbook */
.progress{height:16px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.progress span{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,var(--orange) 10px 20px)}
.step{border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:var(--pop);background:var(--paper)}
.step header{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sc)}
.step .num{flex:none;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:18px}
.step.done .num{background:var(--green)}
.step h3{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1;flex:1}
.step .body{padding:14px;display:flex;flex-direction:column;gap:12px}
.reveal{border:2.5px dashed var(--ink);border-radius:16px;padding:18px;background:var(--wash);font-weight:800;text-align:center}
.secret{position:relative;border:2.5px solid var(--ink);border-radius:16px;padding:18px;background:repeating-linear-gradient(-45deg,#2A2340 0 12px,#342B52 12px 24px);color:#fff;text-align:center;font-weight:800}
.secret.open{background:var(--yellow);color:var(--ink)}
.secret big{display:block;font-family:var(--display);font-size:22px;font-weight:400;line-height:1.2;margin-top:4px}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:12px;border-bottom:2px dashed #DADAE3}
.q:last-child{border-bottom:0;padding-bottom:0}
.q b{font-weight:900}
.q ul{margin:0;padding-left:18px;font-size:14px;color:var(--soft);font-weight:700}
.photo{width:100%;aspect-ratio:4/3;border:2.5px solid var(--ink);border-radius:16px;object-fit:cover;display:block;background:var(--wash)}
.drop{display:grid;place-items:center;gap:6px;aspect-ratio:4/3;border:2.5px dashed var(--ink);border-radius:16px;background:var(--wash);font-weight:900;text-align:center;padding:12px;cursor:pointer}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.toggle{display:flex;align-items:center;gap:10px;font-weight:800}

/* collective */
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-18px;padding:2px 18px 6px}
.chip{flex:none;border:2.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px}
.chip[aria-pressed="true"]{background:var(--aqua);box-shadow:2px 2px 0 var(--ink)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcell{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px;min-width:0}
.pcell img{width:100%;aspect-ratio:1/1;object-fit:cover;border:2.5px solid var(--ink);border-radius:16px}
.entry{border-top:2px dashed #DADAE3;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.entry:first-of-type{border-top:0;padding-top:0}
.entry .by{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--soft)}
.entry p{margin:0}
.kind{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:1px 8px;border:2px solid var(--ink);background:var(--yellow);color:var(--ink)}
.kind.note{background:var(--aqua)} .kind.private{background:#E8E3FF}
.big{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.pray{border:2.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.pray[aria-pressed="true"]{background:var(--pink)}

/* plan + themes */
.months{display:flex;flex-direction:column;gap:12px}
.mrow{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:center;border:2.5px solid var(--ink);border-radius:20px;padding:10px;background:var(--paper);box-shadow:var(--pop)}
.mrow .tile{box-shadow:none;border-width:2px;border-radius:14px}
.mrow .info{min-width:0;text-align:left;background:none;border:0;padding:0}
.mrow .info b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.1}
.mrow .info small{font-weight:700;color:var(--soft)}
.mrow.now{background:#FFFBD6}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.search{display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:14px;padding:0 12px;background:var(--paper)}
.search input{border:0;outline:none;padding:11px 0;flex:1;min-width:0;background:none;font-weight:700}
.empty{text-align:center;font-weight:800;color:var(--soft);padding:24px 8px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--paper);border-top:3px solid var(--ink);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs button{border:2.5px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:900;border-radius:14px}
.tabs svg{width:22px;height:22px}
.tabs button[aria-current="page"]{background:var(--yellow);border-color:var(--ink)}

/* detail */
.detail{position:absolute;inset:0;z-index:5;background:var(--paper);display:flex;flex-direction:column}
.detail[hidden]{display:none!important}
.dtop{position:relative;padding:16px 18px 6px}
.dtop .iconbtn{position:absolute;left:28px;top:26px;z-index:6}
.dtop .tile{max-width:340px;margin:0 auto}
.dtabs{position:sticky;top:0;z-index:4;background:var(--paper);padding:10px 18px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(22,22,22,.45);z-index:9;display:flex;align-items:flex-end}
.sheet{background:var(--paper);width:100%;max-height:82%;border-top:3px solid var(--ink);border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));gap:12px;animation:up .2s ease}
.sheet .grab{width:44px;height:6px;border-radius:6px;background:var(--ink);align-self:center}
.sheet .opts{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:2px 4px 4px}
.opt{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;border:2.5px solid var(--ink);background:var(--paper);border-radius:14px;padding:6px 10px;text-align:left}
.opt .tile{border-width:2px;border-radius:10px;box-shadow:none}
.opt b{display:block;font-weight:900} .opt small{color:var(--soft);font-weight:700;font-size:12px}
.opt[aria-pressed="true"]{background:var(--yellow)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:900;font-size:14px;z-index:20;white-space:nowrap}

/* points */
.pts{flex:none;display:grid;place-items:center;min-width:42px;height:30px;padding:0 6px;border:2.5px solid var(--ink);border-radius:10px;font-family:var(--display);font-size:17px;background:var(--aqua);transform:rotate(-3deg)}
.pts.p2{background:var(--aqua)} .pts.p3{background:var(--yellow)} .pts.p4{background:#C9F27B} .pts.p5{background:var(--orange)} .pts.p10{background:var(--pink)}
.pill.y{background:var(--yellow)}
.big small{font-size:.5em;color:var(--soft)}
.meter{background:#FFFBD6}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pbar{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pbar span{height:22px;border:2.5px solid var(--ink);border-radius:7px;background:var(--paper)}
.pbar span.on{background:var(--pink)} .pbar span.half{background:repeating-linear-gradient(45deg,#FFD3E8 0 5px,var(--paper) 5px 10px)}
.pbar.sm{margin:4px 0} .pbar.sm span{height:12px;border-width:2px;border-radius:4px}
.strip{flex-direction:row;align-items:center;gap:14px;text-align:left;background:var(--yellow)}
.strip .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.list li.hab{flex-direction:column;align-items:stretch;gap:10px}
.list li.hab.won{background:#EAFBEF;margin-inline:-8px;padding-inline:8px;border-radius:12px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.dots span.on{background:var(--green)}
.x{border:0;background:none;font-weight:800;font-size:12px;color:var(--soft);text-decoration:underline;padding:4px 0}
.earned{font-weight:900;background:var(--green);border:2.5px solid var(--ink);border-radius:999px;padding:4px 10px;font-size:13px}
.segopt{display:block;border-left:2.5px solid var(--ink);cursor:pointer}
.segopt:first-child{border-left:0}
.segopt input{position:absolute;opacity:0;width:1px;height:1px}
.segopt span{display:flex;flex-direction:column;align-items:center;padding:8px 2px;font-family:var(--display);font-size:18px;line-height:1.1}
.segopt small{font-family:var(--body);font-size:10px;font-weight:800;color:var(--soft);text-align:center}
.segopt input:checked + span{background:var(--yellow)}
.segopt input:focus-visible + span{outline:3px solid var(--purple);outline-offset:-3px}

/* invite */
.invcard{position:relative;background:var(--cbg);border:3px solid var(--ink);border-radius:26px;box-shadow:var(--pop);overflow:hidden;padding:30px 22px;container-type:inline-size}
.invin{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.invtitle{font-family:var(--display);font-size:clamp(34px,13cqw,52px);line-height:1;text-transform:uppercase}
.invin .swoosh{width:55%;margin-top:-6px}
.invcard blockquote{margin:6px 0 0;font-family:var(--display);font-size:22px;line-height:1.2;background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px;transform:rotate(-1deg)}
.invcard blockquote.ph{color:var(--soft);font-size:18px}
.invcard cite{display:block;font-family:var(--body);font-style:normal;font-weight:900;font-size:14px;margin-top:6px}
.invcard p{margin:0;font-weight:700;max-width:34ch}
.invnext{background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;display:flex;flex-direction:column}
.invnext b{font-family:var(--display);font-weight:400;font-size:20px}
.invnext span{font-weight:800;font-size:13px}
.sharegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sharegrid .btn{text-decoration:none;color:var(--ink);padding:11px 8px}
.previewbar{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:10px 18px;font-weight:800;font-size:13px}
.previewbar .pill{color:var(--ink)}

.frow input[type=text]{padding:8px 10px}
.frow .mins{grid-column:1/2;display:flex;align-items:center;gap:4px;font-weight:800;font-size:12px}

.frow .fbtns{display:flex;gap:6px;justify-content:flex-end}

.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px}

.crow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.sync{font-size:12px;font-weight:800;color:var(--soft);margin-top:4px}

.sync[data-s="saved"]::before{background:var(--green)} .sync[data-s="saving"]::before{background:var(--yellow)} .sync[data-s="error"]::before{background:#E5484D}

.wbhead .num{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-size:16px}

.wbprev{margin:0;padding:10px 12px 0;font-weight:700;color:var(--soft);font-size:14px}

.wbbtns .fbtns button:disabled{opacity:.3}
.seclist{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.fbbox{flex-direction:row;align-items:flex-start;gap:12px;background:var(--aqua);text-align:left}
button.fbbox{align-items:center}
.fbbox .grow{flex:1;min-width:0}

.fbselect{width:100%;border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-weight:700;background:var(--paper)}

.fbbetter.sd .bd-pick,.fbbetter.st .bt-pick{display:flex}

.fbchip span{display:inline-block;border:2.5px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;background:var(--paper);cursor:pointer}
.fbchip input:checked+span{background:var(--yellow)}
.fbchip input:focus-visible+span{outline:3px solid var(--purple);outline-offset:2px}
.fbtags{display:flex;flex-wrap:wrap;gap:6px}
a.pill{color:var(--ink);text-decoration:none;display:inline-block}
.rsvptag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;border:2px solid var(--ink);border-radius:999px;padding:0 7px;margin-top:3px;background:var(--paper)}
.rsvptag.r-going{background:var(--green)} .rsvptag.r-maybe{background:var(--yellow)} .rsvptag.r-no{background:#FFC2C2} .rsvptag.r-none{color:var(--soft);border-color:#C9C9D3}
.pill.att{padding:5px 10px}
.pill.att.on{background:var(--green)} .pill.att.off{background:#FF9E9E}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}

const SLOTS=[{l:-6,t:-6,s:42,r:-12},{l:68,t:2,s:30,r:12},{l:-2,t:64,s:36,r:8},{l:62,t:60,s:42,r:-8},{l:76,t:38,s:20,r:18}];
const SWOOSH='<svg class="swoosh" viewBox="0 0 120 14"><path d="M4 10 Q60 1 116 6" fill="none" stroke="#161616" stroke-width="5" stroke-linecap="round"/></svg>';
const BURST='<svg class="burst" viewBox="0 0 30 30"><path d="M6 14 L4 2 M14 18 L24 6 M18 26 L29 22" stroke="#161616" stroke-width="4" stroke-linecap="round"/></svg>';
function lines(name){const raw=name.split(" ");const tk=[];for(let i=0;i<raw.length;i++){if((raw[i]==="&"||raw[i]==="+")&&raw[i+1]){tk.push(raw[i]+" "+raw[++i])}else tk.push(raw[i])}
  const out=[];tk.forEach(w=>{const l=out[out.length-1];if(l&&(l+" "+w).length<=11&&!/^[&+]/.test(w))out[out.length-1]=l+" "+w;else out.push(w)});
  // merge short connector line with next word if it fits
  return out;}
function tile(t,{key,badge,tag="div",attrs=""}={}){
  const ls=lines(t.name);const longest=Math.max(...ls.map(l=>l.length));let fs=Math.min(16,128/longest);if(ls.length>=3)fs=Math.min(fs,12.5);
  const d=key?eventDate(key,t):null;
  return `<${tag} class="tile" style="--cbg:${t.bg}" ${attrs}>
   ${t.st.slice(0,4).map((s,i)=>{const p=SLOTS[i];return `<span class="stk" style="left:${p.l}%;top:${p.t}%;width:${p.s}%;transform:rotate(${p.r}deg)">${SV[s]}</span>`}).join("")}
   <span class="ttl" style="font-size:${fs}cqw">${BURST}${ls.map(l=>`<span>${esc(l).replace(/^(&amp;|\+) /,(m,a)=>`<i>${a}</i> `)}</span>`).join("")}${SWOOSH}</span>
   ${badge?`<span class="tbadge">${badge}</span>`:""}
   ${d?`<span class="tdate">${fmtMon(d).toUpperCase()} ${d.getDate()}</span>`:""}
  </${tag}>`;
}

function chOf(k,t){return D(k,"ch",(CH[t.id]||[]).map((c,i)=>({id:"t"+i,text:c[0],pts:c[1],days:c[2],row:!!c[3]})))}

  return theme.concat(every,own);}
function runs(log){const ds=[...new Set(log)].sort();let best=0,cur=0,prev=null;
  ds.forEach(d=>{const dt=new Date(d+"T00:00");cur=prev&&(dt-prev)/864e5===1?cur+1:1;best=Math.max(best,cur);prev=dt});
  const last=prev;const y=today();const alive=last&&(y-last)/864e5<=1;return {best,cur:alive?cur:0}}
function status(k,c){const st=((S.commits[k]||{}).taken||{})[c.id];if(!st)return null;
  if(c.secret){const done=!!S.secretDone[k];return {prog:done?1:0,done,today:false}}
  const log=st.log||[];const r=runs(log);const prog=c.row?Math.min(c.days,Math.max(r.best>=c.days?c.days:r.cur)):Math.min(c.days,log.length);
  return {prog,done:c.row?r.best>=c.days:log.length>=c.days,today:log.includes(iso(today())),broke:c.row&&r.best<c.days&&log.length>0&&r.cur===0}}

/* ---------- collective ---------- */
function collective(){
  const c=curKey();const past=months().filter(k=>k.slice(0,7)<=c&&S.plan[k]);
  let body="";
  if(ctab==="Photos"){
    body=`<div class="pgrid">${past.slice().reverse().map(k=>{const t=byId[S.plan[k]];const p=S.photos[k];
      return `<div class="pcell">${p?`<img src="${p}" alt="Group photo, ${monName(k)}">`:tile(t)}<span>${monName(k)} ${p?"":(k.slice(0,7)<c?"· no photo":"· photo pending")}</span></div>`}).join("")}</div>
     <label class="btn y block">Add ${monShort(c)}'s group photo<input type="file" accept="image/*" data-photo="${curGathering()}" hidden></label>`;
  } else if(ctab==="Journal"){
    body=past.slice().reverse().map(k=>{const t=byId[S.plan[k]];const js=S.journal.filter(j=>j.key===k&&(j.shared||j.who==="You"));const ns=S.gnotes.filter(n=>n.key===k);
      if(!js.length&&!ns.length) return `<div class="box"><div class="h2">${esc(t.name)}</div><p class="sub">${monName(k)} · Nothing yet. Journal entries and discussion notes from the workbook land here.</p></div>`;
      return `<div class="box"><div class="h2">${esc(t.name)}</div><p class="sub">${monName(k)}</p>
       ${js.map(j=>`<div class="entry"><div class="by"><span>${esc(j.who)}</span><span class="row"><span class="kind ${j.shared?"":"private"}">${j.shared?"Journal":"Only you"}</span>${j.sample?`<span class="sample">Sample</span>`:""}</span></div><p>${esc(j.text)}</p></div>`).join("")}
       ${ns.map(n=>`<div class="entry"><div class="by"><span>On: ${esc(n.q)}</span><span class="row"><span class="kind note">Group note</span>${n.sample?`<span class="sample">Sample</span>`:""}</span></div><p>${esc(n.text)}</p></div>`).join("")}</div>`}).join("");
  } else if(ctab==="Challenges"){
    body=challenges(curGathering());
  } else if(ctab==="Members"){
    body=membersLog();
  } else if(ctab==="Feedback"){
    body=feedbackLog();
  } else if(ctab==="Interested"){
    body=interestedLog();
  } else {
    body=`<form class="box" data-prayform><label class="h2" for="pwall">Share a request</label><textarea id="pwall" placeholder="What can the group pray for?"></textarea><button class="btn" type="submit">Post request</button></form>
     <div class="box">${S.prayers.length?"":`<p class="who">No requests yet. Share the first one above.</p>`}${S.prayers.map(p=>`<div class="entry"><div class="by"><span><b style="color:var(--ink)">${esc(p.who)}</b> · ${esc(p.when)}</span>${p.sample?`<span class="sample">Sample</span>`:""}</div><p>${esc(p.text)}</p>
      <div class="by">${p.ans?`<span class="kind" style="background:var(--green)">Answered</span>`:p.who==="You"?`<button class="pray" data-ans="${p.id}">Mark answered</button>`:"<span></span>"}
      <button class="pray" data-pray="${p.id}" aria-pressed="${p.me}">${p.me?"Praying":"I'll pray"} · ${p.n}</button></div></div>`).join("")}</div>`;
  }
  return `<div class="top"><div><div class="brand">The Collective<span class="dot">.</span></div><div class="sub">Everything we've gathered, all in one place.</div></div></div>
   <div class="pad"><div class="chips">${["Photos","Journal","Challenges","Prayer"].concat(ME.admin?["Members","Feedback","Interested"]:[]).map(x=>`<button class="chip" data-ctab="${x}" aria-pressed="${ctab===x}">${x}</button>`).join("")}</div>${body}</div>`;
}

/* ---------- plan + themes ---------- */
function plan(){
  const c=curKey();
  return `<div class="top"><div><div class="brand">Year plan<span class="dot">.</span></div><div class="sub">Tap Edit to change a date, time, or location</div></div></div>
  <div class="pad"><div class="months">${months().map(k=>{const t=byId[S.plan[k]];const d=eventDate(k,t);
    return `<div class="mrow ${k===c?"now":""}">${t?tile(t,{tag:"button",attrs:`data-open="${k}" aria-label="Open ${esc(t.name)}"`}):`<div class="tile" style="--cbg:#F2F2F2"></div>`}
     <button class="info" data-open="${k}"><b>${t?esc(t.name):"Open month"}</b><small>${d.toLocaleDateString("en-US",{weekday:"short"})}, ${fmtMon(d)} ${d.getDate()} · ${t?(timeOf(k,t)):""}${k.slice(0,7)===c?" · This month":k.slice(0,7)<c?" · Done":""}</small><small class="place">${det(k).place?esc(det(k).place):"Location to be announced"}</small></button>
     <button class="pill" data-edit="${k}">Edit</button></div>`}).join("")}</div>
   <button class="btn y block" data-addmonth>Add another month</button></div>`;
}
function themes(){
  const list=T.filter(t=>(cat==="All"||t.cat===cat)&&(!q||(t.name+" "+t.tag+" "+t.read).toLowerCase().includes(q.toLowerCase())));
  return `<div class="top"><div><div class="brand">Themes<span class="dot">.</span></div><div class="sub">${T.length} gatherings to choose from</div></div></div>
  <div class="pad"><label class="search">${I.search}<input id="q" type="search" placeholder="Search themes or passages" value="${esc(q)}" aria-label="Search themes"></label>
   <div class="chips">${CATS.map(x=>`<button class="chip" data-cat="${x}" aria-pressed="${cat===x}">${x}</button>`).join("")}</div>
   ${list.length?`<div class="tgrid">${list.map(t=>tile(t,{tag:"button",attrs:`data-theme="${t.id}" aria-label="${esc(t.name)}"`})).join("")}</div>`:`<div class="empty">No themes match “${esc(q)}”.</div>`}</div>`;
}

/* ---------- sheet ---------- */
function sheet(html){document.getElementById("overlay").innerHTML=`<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`}
const closeSheet=()=>document.getElementById("overlay").innerHTML="";
function editMonth(k){const t=byId[S.plan[k]];const o=det(k);const d=eventDate(k,t);
  sheet(`<div class="h2">Edit ${esc(t.name)}</div><form data-editform="${k}" style="display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding:2px">
   <button type="button" class="opt" data-pick="${k}">${tile(t)}<span><b>${esc(t.name)}</b><small>Tap to change the theme</small></span></button>
   <div class="two"><label class="field"><span class="label">Date</span><input type="date" id="ed-date" value="${iso(d)}" required></label>
   <label class="field"><span class="label">Start time</span><input type="time" id="ed-time" value="${to24(timeOf(k,t))}" required></label></div>
   <label class="field"><span class="label">Location</span><input type="text" id="ed-place" value="${esc(o.place||"")}" placeholder="Address or place name" autocomplete="street-address"></label>
   <label class="field"><span class="label">Host (optional)</span><input type="text" id="ed-host" value="${esc(o.host||"")}" placeholder="Who's hosting?"></label>
   <label class="field"><span class="label">Setup</span><textarea id="ed-setup" placeholder="Food, tables, supplies…">${esc(setupOf(k,t))}</textarea></label>
   <button class="btn block" type="submit">Save</button>
   <button type="button" class="btn w block" data-addsame="${k}">Add another gathering in ${monShort(k)}</button>
   <button type="button" class="x" style="align-self:center" data-removemonth="${k}">Remove this gathering from the plan</button>
  </form>`)}
let flowDraft=null,flowKey=null;
function editFlow(k){const t=byId[S.plan[k]];flowKey=k;flowDraft=flowDraft&&flowKey===k?flowDraft:flowOf(k,t).map(r=>[...r]);drawFlow()}
function drawFlow(){const k=flowKey,t=byId[S.plan[k]];let m=startMin(k,t);
  sheet(`<div class="h2">Edit itinerary</div><p class="who" style="margin:-6px 0 0">Starts at ${timeOf(k,t)}. Times update as you change minutes.</p>
   <div class="opts" id="flowrows">${flowDraft.map((r,i)=>{const at=m;m+=Number(r[0])||0;return `<div class="frow">
     <span class="clock">${clock(at)}</span>
     <input type="text" id="fl-label-${i}" data-flabel="${i}" value="${esc(r[1])}" aria-label="Step ${i+1}" placeholder="What happens">
     <label class="mins"><input type="number" id="fl-min-${i}" data-fmin="${i}" value="${r[0]}" min="0" max="240" inputmode="numeric" aria-label="Minutes for step ${i+1}"><span>min</span></label>
     <span class="fbtns"><button type="button" data-fmove="${i}" data-d="-1" aria-label="Move up" ${i?"":"disabled"}>↑</button><button type="button" data-fmove="${i}" data-d="1" aria-label="Move down" ${i<flowDraft.length-1?"":"disabled"}>↓</button><button type="button" data-fdel="${i}" aria-label="Remove step">✕</button></span></div>`}).join("")}</div>
   <p class="who" id="flowend">Ends at ${clock(m)}</p>
   <div class="two"><button class="btn w" data-fadd>Add a step</button><button class="btn w" data-freset>Reset to default</button></div>
   <button class="btn block" data-fsave>Save itinerary</button>`)}
function flowClocks(){const t=byId[S.plan[flowKey]];let m=startMin(flowKey,t);document.querySelectorAll("#flowrows .frow .clock").forEach((el,i)=>{el.textContent=clock(m);m+=Number(flowDraft[i][0])||0});const e=document.getElementById("flowend");if(e)e.textContent="Ends at "+clock(m)}
function pickTheme(k){sheet(`<div class="h2">${monName(k)}</div><div class="opts">${T.map(t=>`<button class="opt" data-setplan="${k}" data-id="${t.id}" aria-pressed="${S.plan[k]===t.id}">${tile(t)}<span><b>${esc(t.name)}</b><small>${t.cat} · ${esc(t.read)}</small></span></button>`).join("")}</div>`)}

const NOTE_STARTERS=["A verse that stuck with me was ","Something someone said that I keep thinking about: ","This month's challenge has changed how I "];
let landingEvent=null;let page=null, landingFrom=null, landingPreview=false, landingStep="intro", landingReply=null;
function inv(){S.invite=S.invite||{name:"",note:"",phone:"",overview:OVERVIEW};return S.invite}
function featured(){const t0=today();const ms=months().filter(k=>S.plan[k]);return ms.find(k=>eventDate(k,byId[S.plan[k]])>=t0)||ms[ms.length-1]||curKey()}
function inviteSlug(){const v=inv();const nm=(v.name||"").replace(/[^A-Za-z]/g,"").slice(0,20);const ph=(v.phone||"").replace(/\D/g,"").slice(-10);
  const k=featured();const t=byId[S.plan[k]];let ev="";if(t){const d=eventDate(k,t);ev=`-d${iso(d).replace(/-/g,"")}-t${to24(timeOf(k,t)).replace(":","")}-th_${t.id}`}
  return "i"+(nm?"-"+nm:"")+(ph.length>=10?"-"+ph:"")+ev}
const inviteLink=()=>`${ART_URL}#${inviteSlug()}`;
function eventLine(k){const t=byId[S.plan[k]];const d=eventDate(k,t);return `${t.name}, ${fmtLong(d)} at ${timeOf(k,t)}`}
function inviteMsg(){const v=inv();const k=featured();
  return `Hi! I want to invite you to something I love.\n\n${v.overview||OVERVIEW}\n\n${v.note?`What's meant the most to me lately: “${v.note}”\n\n`:""}Next one: ${eventLine(k)}.\nTap the link and hit "I'm interested": ${inviteLink()}${v.name?`\n\n– ${v.name}`:""}`}
const fmtPhone=p=>{const d=String(p||"").replace(/\D/g,"").slice(-10);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:p||""};

function inviteCard(){const v=inv();const k=featured();const t=byId[S.plan[k]];const d=eventDate(k,t);

    ${t.st.slice(0,4).map((s,i)=>{const p=[{l:-6,t:-5,s:24,r:-12},{l:80,t:-3,s:20,r:12},{l:-4,t:84,s:20,r:8},{l:80,t:82,s:24,r:-8}][i];return `<span class="stk" style="left:${p.l}%;top:${p.t}%;width:${p.s}%;transform:rotate(${p.r}deg)">${SV[s]}</span>`}).join("")}
    <div class="invin">

     <p>${esc(v.overview||OVERVIEW)}</p>
     <div class="invnext"><b>Next: ${esc(t.name)}</b><span>${fmtLong(d)} · ${timeOf(k,t)}</span></div>
    </div></div>`}

function inviteView(){const v=inv();
  return `<div class="scroll" id="dscroll"><div class="top"><button class="iconbtn" data-closepage aria-label="Back">${I.back}</button><div style="flex:1"><div class="brand" style="font-size:28px">Invite a friend<span class="dot">.</span></div></div></div>
  <div class="pad">

    </div>
    <button class="btn y block" data-saveimg id="saveimg">Save or share card as an image</button><button class="btn block" data-sharenative id="sharenative" hidden>Share…</button>
    <p class="who">If “Text it” doesn't open your messages app, use Copy message and paste it into a text.</p>
    <textarea id="copybox" readonly aria-label="Invite message" style="min-height:120px;font-size:13px">${esc(inviteMsg())}</textarea>

function refreshInvite(){const p=document.getElementById("invprev");if(!p)return;p.innerHTML=inviteCard();const m=inviteMsg(),l=inviteLink();

/* what the friend sees */

    <div class="sub" style="text-align:center">${esc(who)} invited you to</div>
    <div class="brand" style="text-align:center;font-size:40px">Bible Brunch<span class="dot">.</span></div>
    ${tile(t,{key:k,badge:"Next gathering"})}
    <div class="box"><p style="font-weight:700">${esc(OVERVIEW)}</p>
     <ul class="list">${[["sun","Share a meal around a fun theme"],["bible","Open the Bible together. No experience needed."],["heart","Leave with a challenge for the month"]].map(([s,x])=>`<li><span style="width:38px;flex:none">${SV[s]}</span><span class="grow">${x}</span></li>`).join("")}</ul></div>
    <div class="box tint"><dl class="meta"><dt>What</dt><dd>${esc(t.name)}</dd><dt>When</dt><dd>${fmtLong(d)} · ${timeOf(k,t)}</dd><dt>Where</dt><dd>A home in the area. Address shared after you reply.</dd></dl></div>
    ${action}

/* card image for Instagram / Stories */
async function saveCardImage(){
  const v=inv();const k=featured();const t=byId[S.plan[k]];const d=eventDate(k,t);
  try{await document.fonts.load('80px "Chewy"');await document.fonts.load('800 40px "Nunito"')}catch(e){}
  const W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  g.fillStyle="#FFFFFF";g.fillRect(0,0,W,H);g.fillStyle=t.bg;g.strokeStyle="#161616";g.lineWidth=12;
  const rr=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r)};rr(40,40,W-80,H-80,60);g.fill();g.stroke();
  const img=s=>new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(SV[s].replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" '))});
  const pos=[[30,30,260,-0.2],[W-270,40,220,0.2],[40,H-280,230,0.15],[W-300,H-300,270,-0.15]];
  for(let i=0;i<4;i++){const im=await img(t.st[i]);if(!im)continue;const [x,y,s,r]=pos[i];g.save();g.translate(x+s/2,y+s/2);g.rotate(r);g.drawImage(im,-s/2,-s/2,s,s);g.restore()}
  g.fillStyle="#161616";g.textAlign="center";
  g.font='900 38px "Nunito", sans-serif';g.fillText("YOU'RE INVITED TO",W/2,300);
  g.font='130px "Chewy", cursive';g.fillText("BIBLE BRUNCH",W/2,430);
  g.lineWidth=12;g.lineCap="round";g.beginPath();g.moveTo(W/2-260,470);g.quadraticCurveTo(W/2,445,W/2+260,462);g.stroke();
  const wrap=(text,y,font,lh,maxW)=>{g.font=font;const words=text.split(" ");let line="",yy=y;for(const w of words){const test=line?line+" "+w:w;if(g.measureText(test).width>maxW&&line){g.fillText(line,W/2,yy);line=w;yy+=lh}else line=test}if(line)g.fillText(line,W/2,yy);return yy+lh};
  let y=570;
  if(v.note){y=wrap("“"+v.note+"”",y,'58px "Chewy", cursive',70,820);if(v.name){g.font='800 36px "Nunito", sans-serif';g.fillText("– "+v.name,W/2,y);y+=60}}

const reduceMotion=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function pointOf(src){if(src&&src.clientX!=null&&(src.clientX||src.clientY))return [src.clientX,src.clientY];
  const el=src&&src.target?src.target:src;const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;return r?[r.left+r.width/2,r.top+r.height/2]:[innerWidth/2,innerHeight/2]}
function graphemes(str){try{return [...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(str)].map(x=>x.segment)}catch(e){return Array.from(str).filter(c=>!/[\uFE0F\u200D]/.test(c))}}
function burst(src,key,n){const id=S.plan[key];if(!id)return;const set=graphemes(POP[id]||"✨💛");
  const phone=document.getElementById("phone");const pr=phone.getBoundingClientRect();const [cx,cy]=pointOf(src);const x0=cx-pr.left,y0=cy-pr.top;
  let layer=document.getElementById("fx");if(!layer){layer=document.createElement("div");layer.id="fx";phone.appendChild(layer)}
  const count=reduceMotion?6:(n||16);
  for(let i=0;i<count;i++){const sp=document.createElement("span");sp.className="pop";sp.textContent=set[i%set.length];
    const size=22+Math.random()*16;sp.style.cssText=`left:${x0}px;top:${y0}px;font-size:${size}px`;layer.appendChild(sp);
    if(reduceMotion){sp.animate([{opacity:1,transform:"translate(-50%,-50%) scale(1)"},{opacity:0,transform:"translate(-50%,-50%) scale(1.2)"}],{duration:1200}).onfinish=()=>sp.remove();continue}
    const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.5;const dist=60+Math.random()*(n>20?220:130);const dx=Math.cos(a)*dist,dy=Math.sin(a)*dist;const rot=(Math.random()-.5)*540;const dur=1700+Math.random()*700;
    sp.animate([{transform:"translate(-50%,-50%) scale(.3) rotate(0deg)",opacity:1},
      {transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(1) rotate(${rot*.6}deg)`,opacity:1,offset:.4},
      {transform:`translate(calc(-50% + ${dx*1.1}px),calc(-50% + ${dy+50}px)) scale(1) rotate(${rot*.8}deg)`,opacity:1,offset:.75},
      {transform:`translate(calc(-50% + ${dx*1.2}px),calc(-50% + ${dy+120}px)) scale(.9) rotate(${rot}deg)`,opacity:0}],
      {duration:dur,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"}).onfinish=()=>sp.remove()}}
